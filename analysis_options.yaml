# Static analysis configuration for Charty.
#
# Run with `flutter analyze`.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Treat implicit downcasts from dynamic as errors. Most of this codebase
    # decodes JSON, where a silent bad cast is the easiest bug to ship.
    strict-casts: true
    strict-raw-types: true

  errors:
    # Unused code is a correctness signal here, not a style preference.
    unused_import: error
    unused_local_variable: error
    unused_field: warning
    dead_code: warning

    # Deliberately relaxed: this project pairs private fields with public named
    # parameters (`required Logger logger` -> `_logger`). The lint's suggested
    # fix (`required this._logger`) would force callers to pass a private
    # argument name, so it is not applicable.
    prefer_initializing_formals: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_relative_lib_imports
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - use_super_parameters
